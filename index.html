<!DOCTYPE html>
<html lang="zh-Hant" id="main-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.2/firebase-firestore.js"></script>
    
    <style>
        /* 你的 CSS 樣式保持不變 */
        body {
            background-color: #f8f9fa;
            font-family: 'Microsoft JhengHei', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }
        /* ... 保持你所有的 CSS 樣式不變 ... */
    </style>
</head>
<body>
    <!-- 導航欄和所有 HTML 內容保持不變 -->
    <!-- 你的 HTML 結構完全保持原樣 -->
    
    <!-- 頁尾保持不變 -->
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // ========== Firebase 配置和初始化 ==========
        const firebaseConfig = {
            apiKey: "AIzaSyA7F0JbTqI5THGUQnqp7_BSBALAQQeIAk",
            authDomain: "testsystem-2056d.firebaseapp.com",
            projectId: "testsystem-2056d",
            storageBucket: "testsystem-2056d.firebasestorage.app",
            messagingSenderId: "1085110426660",
            appId: "1:1085110426660:web:48af6f7864bc567f536ccb1"
        };
        
        // 初始化 Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.getFirestore(app);
        
        // ========== 你的原有變量和函數 ==========
        let currentGrade = null;
        let currentSubject = null;
        let currentTerm = null;
        let currentYear = null;
        let currentLang = 'zh';
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            changeLang('zh');
            document.getElementById('subjectDropdown').disabled = false;
            document.getElementById('termDropdown').disabled = false;
            document.getElementById('yearDropdown').disabled = false;
            updateSteps();
        });
        
        // ========== 修改搜尋函數，使用 Firebase ==========
        async function searchPapers() {
            if (!currentGrade || !currentSubject || !currentTerm || !currentYear) {
                const alertMsg = currentLang === 'zh' ? 
                    '請填寫所有搜尋條件！' : 
                    'Please fill in all search criteria!';
                alert(alertMsg);
                return;
            }
            
            // 顯示加載中
            const resultsBody = document.getElementById('results-body');
            resultsBody.innerHTML = `
                <div class="no-results">
                    <div class="spinner-border text-primary mb-3" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p>${currentLang === 'zh' ? '正在搜尋中...' : 'Searching...'}</p>
                </div>
            `;
            
            document.getElementById('results-section').style.display = 'block';
            
            try {
                // 從 Firebase Firestore 搜尋
                const papers = await searchPapersInFirebase();
                displaySearchResults(papers);
            } catch (error) {
                console.error('搜尋失敗:', error);
                resultsBody.innerHTML = `
                    <div class="no-results">
                        <i class="bi bi-exclamation-triangle text-danger" style="font-size: 3rem;"></i>
                        <p>${currentLang === 'zh' ? '搜尋失敗，請稍後再試' : 'Search failed, please try again'}</p>
                    </div>
                `;
            }
        }
        
        // 從 Firebase 搜尋試卷
        async function searchPapersInFirebase() {
            const papersRef = firebase.collection(db, "papers");
            const q = firebase.query(
                papersRef,
                firebase.where("grade", "==", currentGrade),
                firebase.where("subject", "==", currentSubject),
                firebase.where("term", "==", currentTerm),
                firebase.where("year", "==", currentYear)
            );
            
            const querySnapshot = await firebase.getDocs(q);
            const papers = [];
            
            querySnapshot.forEach((doc) => {
                papers.push({
                    id: doc.id,
                    ...doc.data()
                });
            });
            
            return papers;
        }
        
        // 顯示搜尋結果
        function displaySearchResults(papers) {
            const resultsBody = document.getElementById('results-body');
            updateResultsTitle();
            
            if (papers.length === 0) {
                resultsBody.innerHTML = `
                    <div class="no-results">
                        <i class="bi bi-file-earmark-text" style="font-size: 3rem; color: #dee2e6;"></i>
                        <p>${currentLang === 'zh' ? '暫無符合條件的試卷檔案。成為首個貢獻者！' : 'No matching papers found. Be the first contributor!'}</p>
                        <p style="font-size: 0.9rem; color: #6c757d;">
                            ${currentLang === 'zh' ? '如果您有此試卷，歡迎透過下方上傳功能分享給大家！' : 'If you have this paper, please share it through the upload section below!'}
                        </p>
                    </div>
                `;
                return;
            }
            
            let resultsHTML = '';
            papers.forEach(paper => {
                const title = currentLang === 'zh' ? paper.title_zh : paper.title_en;
                const driveUrl = paper.driveUrl || '#';
                
                resultsHTML += `
                    <div class="result-item">
                        <div class="result-title">${title}</div>
                        <div class="result-meta">
                            ${currentLang === 'zh' ? '已找到對應的試卷檔案' : 'Matching paper found'}
                        </div>
                        <div>
                            <a href="${driveUrl}" target="_blank" rel="noopener noreferrer" class="result-link">
                                <i class="bi bi-google-drive"></i>
                                <span>${currentLang === 'zh' ? '前往 Google Drive 查看試卷' : 'View Papers on Google Drive'}</span>
                            </a>
                        </div>
                    </div>
                `;
            });
            
            resultsBody.innerHTML = resultsHTML;
            document.getElementById('results-section').scrollIntoView({ behavior: 'smooth' });
        }
        
        // ========== 保持你原有的其他函數不變 ==========
        function handleGradeSelect(value) { currentGrade = value; updateSteps(); }
        function handleSubjectSelect(value) { currentSubject = value; updateSteps(); }
        function handleTermSelect(value) { currentTerm = value; updateSteps(); }
        function handleYearSelect(value) { currentYear = value; updateSteps(); }
        
        function updateSteps() {
            document.querySelectorAll('.step').forEach(step => step.classList.remove('active'));
            if (currentGrade) document.getElementById('step1').classList.add('active');
            if (currentSubject) document.getElementById('step2').classList.add('active');
            if (currentTerm) document.getElementById('step3').classList.add('active');
            if (currentYear) document.getElementById('step4').classList.add('active');
        }
        
        function updateResultsTitle() {
            const gradeNames = {
                jh1: { en: "Junior High 1", zh: "初中一年級" },
                jh2: { en: "Junior High 2", zh: "初中二年級" },
                jh3: { en: "Junior High 3", zh: "初中三年級" },
                sh1: { en: "Senior High 1", zh: "高中一年級" },
                sh2: { en: "Senior High 2", zh: "高中二年級" },
                sh3: { en: "Senior High 3", zh: "高中三年級" },
                other: { en: "Advanced Level", zh: "進階學段" }
            };
            
            const subjectNames = {
                chi: { en: "Chinese Literature", zh: "中文文學" },
                eng: { en: "English Language", zh: "英語語言" },
                math: { en: "Mathematics", zh: "數學" },
                phy: { en: "Physics", zh: "物理" },
                chem: { en: "Chemistry", zh: "化學" },
                bio: { en: "Biology", zh: "生物" }
            };
            
            const termNames = {
                t1: { en: "First Semester", zh: "第一學期" },
                t2: { en: "Second Semester", zh: "第二學期" },
                t3: { en: "Third Semester", zh: "第三學期" }
            };
            
            const gradeText = gradeNames[currentGrade] ? gradeNames[currentGrade][currentLang] : currentGrade;
            const subjectText = subjectNames[currentSubject] ? subjectNames[currentSubject][currentLang] : currentSubject;
            const termText = termNames[currentTerm] ? termNames[currentTerm][currentLang] : currentTerm;
            
            const title = currentLang === 'zh' ? 
                `搜尋結果：${gradeText} / ${subjectText} / ${termText} / ${currentYear}` :
                `Search Results: ${gradeText} / ${subjectText} / ${termText} / ${currentYear}`;
            
            document.getElementById('results-title').textContent = title;
        }
        
        function resetSearch() {
            currentGrade = currentSubject = currentTerm = currentYear = null;
            document.getElementById('gradeDropdown').selectedIndex = 0;
            document.getElementById('subjectDropdown').selectedIndex = 0;
            document.getElementById('termDropdown').selectedIndex = 0;
            document.getElementById('yearDropdown').selectedIndex = 0;
            document.getElementById('results-section').style.display = 'none';
            updateSteps();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        function changeLang(lang) {
            currentLang = lang;
            document.getElementById('main-html').setAttribute('lang', lang === 'zh' ? 'zh-Hant' : 'en');
            document.querySelectorAll('.lang-text').forEach(element => {
                const text = element.getAttribute(`data-${lang}`);
                if (text) element.textContent = text;
            });
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll(`#lang-btn-${lang}`).forEach(btn => btn.classList.add('active'));
        }
        
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if (targetId === '#') return;
                const targetElement = document.querySelector(targetId);
                if (targetElement) {
                    targetElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                }
            });
        });
    </script>
</body>
</html>
