<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Google 登录示例</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Firebase Google 登录示例</h1>
        <button id="loginBtn" class="btn">使用 Google 登录</button>
        <button id="logoutBtn" class="btn" style="display: none;">登出</button>
        <div id="userInfo" style="display: none;">
            <h2>用户信息</h2>
            <p id="name"></p>
            <img id="profilePicture" src="" alt="头像" class="profile-pic"/>
        </div>
    </div>
</body>
</html>
