<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    <title>試卷題庫系統</title>
</head>
<body>
    <div class="container">
        <h1>試卷題庫系統</h1>
        <div id="login-section" class="login-section">
            <h2>使用 Google 登入</h2>
            <button class="btn main-btn" onclick="loginWithGoogle()">登入</button>
            <p id="login-error" class="text-danger"></p>
        </div>

        <div id="main-content" class="main-content">
            <div class="welcome-section">
                <h2>歡迎來到試卷題庫系統</h2>
                <p>查找初中至高中的舊試卷：中文、英文、數學、物理、化學、生物。</p>
                <a href="#upload" class="btn secondary-btn">上傳試卷</a>
            </div>
        </div>
    </div>
    
    <script type="module" src="script.js"></script>
</body>
</html>
