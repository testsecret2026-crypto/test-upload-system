<!DOCTYPE html>
<html>
<head>
    <title>測試 Firestore</title>
</head>
<body>
    <h1>測試 Firestore 連線</h1>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        // 從 Firebase Console 複製的設定
        const firebaseConfig = {
            apiKey: "您的 apiKey",
            authDomain: "您的 authDomain",
            projectId: "您的 projectId",
            storageBucket: "您的 storageBucket",
            messagingSenderId: "您的 messagingSenderId",
            appId: "您的 appId"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // 測試讀取資料
        async function testReadData() {
            try {
                // 先登入測試帳號
                await auth.signInWithEmailAndPassword(
                    "test@example.com", 
                    "test123456"
                );
                
                const user = auth.currentUser;
                console.log("當前用戶 UID:", user.uid);
                
                // 讀取 users 資料
                const doc = await db.collection("users").doc(user.uid).get();
                
                if (doc.exists) {
                    console.log("用戶資料:", doc.data());
                    alert("成功讀取資料！\nEmail: " + doc.data().email);
                } else {
                    console.log("找不到文件");
                }
            } catch (error) {
                console.error("錯誤:", error);
                alert("錯誤: " + error.message);
            }
        }
        
        // 頁面載入後執行測試
        window.onload = testReadData;
    </script>
</body>
</html>
