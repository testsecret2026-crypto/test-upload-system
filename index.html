<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase 權限測試</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .loading { background: #fff3cd; color: #856404; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Firebase 權限測試</h1>
    <div id="status"></div>
    <button onclick="testPermissions()">測試 Firestore 權限</button>
    <button onclick="testCreateUserDoc()">測試建立用戶文件</button>
    <button onclick="testReadUserDoc()">測試讀取用戶文件</button>
    <div id="result"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDHaIeMD8WnFKtDuF08_5GseMC6S-OCCi0",
            authDomain: "project-7983367571690113440.firebaseapp.com",
            projectId: "project-7983367571690113440",
            storageBucket: "project-7983367571690113440.firebasestorage.app",
            messagingSenderId: "17335949650",
            appId: "1:17335949650:web:ef1f03971b2d0ee74f028b"
        };
        
        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        function updateStatus(message, type = 'info') {
            const div = document.getElementById('status');
            div.textContent = message;
            div.className = `status ${type}`;
        }
        
        async function testPermissions() {
            updateStatus('正在測試 Firestore 權限...', 'loading');
            
            try {
                // 1. 先登入
                await auth.signInWithEmailAndPassword("test@example.com", "test123456");
                const user = auth.currentUser;
                
                // 2. 測試寫入 users 集合
                await db.collection('users').doc(user.uid).set({
                    email: user.email,
                    displayName: user.email.split('@')[0],
                    testTime: new Date().toISOString()
                }, { merge: true });
                
                updateStatus('✅ 寫入權限測試成功！', 'success');
                
                // 3. 測試讀取
                const doc = await db.collection('users').doc(user.uid).get();
                if (doc.exists) {
                    document.getElementById('result').innerHTML = 
                        `<pre>讀取成功：${JSON.stringify(doc.data(), null, 2)}</pre>`;
                }
                
                // 登出
                await auth.signOut();
                
            } catch (error) {
                updateStatus(`❌ 權限錯誤：${error.code} - ${error.message}`, 'error');
                console.error('詳細錯誤：', error);
            }
        }
        
        async function testCreateUserDoc() {
            updateStatus('正在測試建立用戶文件...', 'loading');
            
            try {
                // 登入
                await auth.signInWithEmailAndPassword("test@example.com", "test123456");
                const user = auth.currentUser;
                
                // 建立用戶資料
                const userData = {
                    email: user.email,
                    displayName: "測試用戶",
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    emailVerified: true,
                    lastLogin: new Date().toISOString()
                };
                
                await db.collection('users').doc(user.uid).set(userData);
                updateStatus(`✅ 用戶文件建立成功！UID: ${user.uid}`, 'success');
                
                document.getElementById('result').innerHTML = 
                    `<pre>建立的文件：${JSON.stringify(userData, null, 2)}</pre>`;
                
                await auth.signOut();
                
            } catch (error) {
                updateStatus(`❌ 建立失敗：${error.message}`, 'error');
            }
        }
        
        async function testReadUserDoc() {
            updateStatus('正在測試讀取用戶文件...', 'loading');
            
            try {
                await auth.signInWithEmailAndPassword("test@example.com", "test123456");
                const user = auth.currentUser;
                
                const doc = await db.collection('users').doc(user.uid).get();
                
                if (doc.exists) {
                    updateStatus('✅ 讀取成功！', 'success');
                    document.getElementById('result').innerHTML = 
                        `<pre>用戶資料：${JSON.stringify(doc.data(), null, 2)}</pre>`;
                } else {
                    updateStatus('⚠️ 文件不存在，請先建立', 'loading');
                }
                
                await auth.signOut();
                
            } catch (error) {
                updateStatus(`❌ 讀取失敗：${error.message}`, 'error');
            }
        }
        
        // 自動測試
        window.onload = async function() {
            updateStatus('準備就緒，請點擊按鈕測試', 'success');
        };
    </script>
</body>
</html>
