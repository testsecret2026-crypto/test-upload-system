<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">
    
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <style>
        body { background: #f8f9fa; font-family: 'Microsoft JhengHei'; }
        .navbar { background: white; border-bottom: 1px solid #dee2e6; }
        .container { max-width: 1200px; }
        .welcome-section { background: white; padding: 2rem; border-radius: 8px; margin: 2rem 0; }
        .google-btn { background: white; border: 1px solid #dadce0; padding: 10px; border-radius: 4px; width: 100%; }
    </style>
</head>
<body>
    <!-- 導航欄 -->
    <nav class="navbar">
        <div class="container">
            <div class="d-flex justify-content-between w-100">
                <a class="navbar-brand" href="#">試卷題庫系統</a>
                <div>
                    <!-- 用戶資訊 -->
                    <div id="userInfo" class="d-none d-inline-flex align-items-center">
                        <img src="" id="userPhoto" width="30" height="30" class="rounded-circle me-2">
                        <span id="userName" class="me-3"></span>
                        <button class="btn btn-sm btn-outline-danger" onclick="logout()">登出</button>
                    </div>
                    <!-- 登入按鈕 -->
                    <button class="btn btn-sm btn-outline-primary" id="loginBtn" onclick="showLogin()">
                        <i class="bi bi-google me-1"></i>登入
                    </button>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- 登入彈窗 -->
    <div class="modal fade" id="loginModal">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-body text-center p-5">
                    <h5 class="mb-4">使用 Google 登入</h5>
                    <button class="google-btn mb-3" onclick="googleLogin()">
                        <img src="https://img.icons8.com/color/16/000000/google-logo.png" class="me-2">
                        使用 Google 繼續
                    </button>
                    <div class="text-danger small" id="loginError"></div>
                    <div class="text-muted small mt-4">
                        <p>我們只會取得您的電郵和姓名</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="container">
        <!-- 內容區域 -->
        <div class="welcome-section">
            <h1>試卷題庫系統</h1>
            <p>查找舊試卷，幫助學習！</p>
        </div>
    </div>
    
    <!-- 頁腳 -->
    <div class="text-center text-muted mt-5 py-3">
        試卷題庫系統 &copy; 2024
    </div>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // 簡單的登入功能
        async function googleLogin() {
            try {
                // 初始化 Firebase
                if (!firebase.apps.length) {
                    firebase.initializeApp(firebaseConfig);
                }
                
                // Google 登入
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await firebase.auth().signInWithPopup(provider);
                
                // 成功
                alert('登入成功！');
                updateUI(result.user);
                
                // 關閉彈窗
                const modal = bootstrap.Modal.getInstance(document.getElementById('loginModal'));
                modal.hide();
                
            } catch (error) {
                document.getElementById('loginError').textContent = '登入失敗：' + error.message;
                console.log('錯誤：', error);
            }
        }
        
        // 登出
        async function logout() {
            await firebase.auth().signOut();
            updateUI(null);
            alert('已登出');
        }
        
        // 更新介面
        function updateUI(user) {
            if (user) {
                // 已登入
                document.getElementById('userName').textContent = user.displayName;
                document.getElementById('userPhoto').src = user.photoURL || 'https://cdn-icons-png.flaticon.com/512/3135/3135715.png';
                document.getElementById('userInfo').classList.remove('d-none');
                document.getElementById('loginBtn').classList.add('d-none');
            } else {
                // 未登入
                document.getElementById('userInfo').classList.add('d-none');
                document.getElementById('loginBtn').classList.remove('d-none');
            }
        }
        
        // 顯示登入視窗
        function showLogin() {
            new bootstrap.Modal(document.getElementById('loginModal')).show();
        }
        
        // 頁面載入
        document.addEventListener('DOMContentLoaded', function() {
            // 監聽登入狀態
            firebase.auth().onAuthStateChanged(function(user) {
                updateUI(user);
            });
        });
    </script>
</body>
</html>
