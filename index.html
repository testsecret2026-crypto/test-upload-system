<!DOCTYPE html>
<html>
<body>
    <button onclick="testGoogleLogin()">🎯 立即测试 Google 登录</button>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    
    <script>
        // Firebase 配置 - 保持不变
        const firebaseConfig = {
            apiKey: "AIzaSyA7FOJbTqI5ThGUIqnp7_BSbALAGQqEA1k",
            authDomain: "testsystem-2056d.firebaseapp.com",
            projectId: "testsystem-2056d",
            storageBucket: "testsystem-2056d.appspot.com",
            messagingSenderId: "1085110426660",
            appId: "1:1085110426660:web:48af67864bc567f536ccb1"
        };
        
        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        
        async function testGoogleLogin() {
            console.log('开始 Google 登录...');
            
            try {
                // 创建 Google 登录提供者
                const provider = new firebase.auth.GoogleAuthProvider();
                
                // 添加必要的权限范围
                provider.addScope('email');
                provider.addScope('profile');
                
                // 使用弹窗登录
                const result = await firebase.auth().signInWithPopup(provider);
                
                // 登录成功
                const user = result.user;
                console.log('✅ 登录成功！', user);
                
                alert(
                    '🎉 Google 登录成功！\n\n' +
                    '👤 用户名: ' + user.displayName + '\n' +
                    '📧 邮箱: ' + user.email + '\n' +
                    '🆔 UID: ' + user.uid
                );
                
            } catch (error) {
                console.error('❌ 登录错误详情:', error);
                
                // 友好的错误提示
                let errorMessage = '登录失败: ';
                
                switch (error.code) {
                    case 'auth/popup-blocked':
                        errorMessage += '弹窗被浏览器阻止，请允许弹窗';
                        break;
                    case 'auth/popup-closed-by-user':
                        errorMessage += '您关闭了登录窗口';
                        break;
                    case 'auth/unauthorized-domain':
                        errorMessage += '当前域名未授权，请在 Firebase 中添加 localhost 到授权域名';
                        break;
                    case 'auth/operation-not-allowed':
                        errorMessage += 'Google 登录方法未启用，请检查 Firebase 配置';
                        break;
                    default:
                        errorMessage += error.message;
                }
                
                alert('❌ ' + errorMessage);
                console.log('错误代码:', error.code);
                console.log('完整错误:', error);
            }
        }
    </script>
</body>
</html>
