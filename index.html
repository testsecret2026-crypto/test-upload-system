<!DOCTYPE html>
<html>
<head>
    <title>測驗系統登入</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
        }
        .login-btn {
            background: #4285F4;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 5px;
            cursor: pointer;
            margin: 20px;
        }
        .login-btn:hover {
            background: #3367D6;
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js"></script>
</head>
<body>
    <h1>測驗系統</h1>
    <p>使用 Google 帳號登入</p>
    
    <button class="login-btn" onclick="loginWithGoogle()">
        🔐 用 Google 登入
    </button>
    
    <div id="userInfo" style="display:none; margin-top: 20px;">
        <p>已登入為: <span id="userName"></span></p>
        <button onclick="logout()">登出</button>
    </div>

    <script>
        // 你的 Firebase 設定
        const firebaseConfig = {
            apiKey: "AIzaSyCafcGCfQZRdpj5xqu-WTDRZFd75BfPtbQ",
            authDomain: "test-ef369.firebaseapp.com",
            projectId: "test-ef369",
            storageBucket: "test-ef369.firebasestorage.app",
            messagingSenderId: "633157258867",
            appId: "1:633157258867:web:a844ad7bb6fd0caf74e406"
        };

        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        
        // 監聽登入狀態
        firebase.auth().onAuthStateChanged((user) => {
            if (user) {
                // 用戶已登入
                document.getElementById('userName').textContent = user.displayName || user.email;
                document.getElementById('userInfo').style.display = 'block';
                console.log('用戶已登入:', user.email);
            } else {
                // 用戶未登入
                document.getElementById('userInfo').style.display = 'none';
                console.log('用戶未登入');
            }
        });

        // Google 登入函數
        async function loginWithGoogle() {
            try {
                const provider = new firebase.auth.GoogleAuthProvider();
                const result = await firebase.auth().signInWithPopup(provider);
                
                const user = result.user;
                console.log('登入成功:', user.email);
                
                // 儲存到 localStorage（可選）
                localStorage.setItem('userEmail', user.email);
                localStorage.setItem('userName', user.displayName);
                
                // 顯示成功訊息
                alert('歡迎 ' + user.displayName + '!');
                
            } catch (error) {
                console.error('登入錯誤:', error);
                alert('登入失敗: ' + error.message);
            }
        }

        // 登出函數
        function logout() {
            firebase.auth().signOut();
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            alert('已登出');
        }
    </script>
</body>
</html>
