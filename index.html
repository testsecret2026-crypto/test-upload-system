<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>試卷題庫系統 - 驗證碼註冊</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* 登出成功提示 */
        .logout-toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 1000;
            opacity: 0;
            transform: translateY(-20px);
            transition: all 0.3s ease;
        }
        
        .logout-toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* 主容器 */
        .login-container {
            width: 100%;
            max-width: 420px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        /* 右上角控制面板 */
        .top-controls {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        
        .logout-btn {
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #555;
            box-shadow: 0 3px 10px rgba(0,0,0,0.1);
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: white;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        
        /* 頂部區域 */
        .header {
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
            padding: 50px 40px 40px;
            color: white;
            text-align: center;
        }
        
        .logo {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }
        
        .main-title {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .subtitle {
            font-size: 14px;
            opacity: 0.9;
            line-height: 1.5;
        }
        
        /* 表單區域 */
        .form-area {
            padding: 40px;
        }
        
        /* 表單切換 */
        .form-tabs {
            display: flex;
            background: #f5f7fa;
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 30px;
        }
        
        .tab-btn {
            flex: 1;
            padding: 14px;
            text-align: center;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab-btn.active {
            background: white;
            color: #3a7bd5;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
        }
        
        /* 表單內容 */
        .form-content {
            display: none;
        }
        
        .form-content.active {
            display: block;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #444;
            font-weight: 500;
            font-size: 14px;
        }
        
        .input-group input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
        }
        
        .input-group input:focus {
            border-color: #3a7bd5;
            outline: none;
            box-shadow: 0 0 0 3px rgba(58, 123, 213, 0.1);
        }
        
        .input-group input.error {
            border-color: #ff3860;
        }
        
        /* 驗證碼區塊 */
        .verification-code {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }
        
        .verification-code input {
            flex: 1;
            text-align: center;
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 3px;
        }
        
        .resend-code {
            margin-top: 10px;
            text-align: center;
        }
        
        .send-code-btn {
            padding: 10px 20px;
            background: #3a7bd5;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .send-code-btn:hover:not(:disabled) {
            background: #2a6bc4;
        }
        
        .send-code-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        /* 倒數計時 */
        .countdown {
            font-size: 14px;
            color: #ff9800;
            margin-top: 5px;
        }
        
        /* 提交按鈕 */
        .submit-btn {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #3a7bd5 0%, #00d2ff 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(58, 123, 213, 0.3);
        }
        
        .submit-btn:active {
            transform: translateY(0);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        /* 分隔線 */
        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0;
            color: #95a5a6;
        }
        
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #e1e5eb;
        }
        
        .divider span {
            padding: 0 15px;
            font-size: 14px;
        }
        
        /* Google登入按鈕 */
        .google-btn {
            width: 100%;
            padding: 16px;
            background: white;
            color: #444;
            border: 2px solid #e1e5eb;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }
        
        .google-btn:hover {
            border-color: #3a7bd5;
            background: #f8fafc;
        }
        
        .google-btn img {
            width: 20px;
            height: 20px;
        }
        
        /* 錯誤訊息 */
        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #c62828;
            display: flex;
            align-items: center;
            gap: 10px;
            display: none;
        }
        
        .error-message.show {
            display: flex;
        }
        
        /* 成功訊息 */
        .success-message {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #4CAF50;
            display: flex;
            align-items: center;
            gap: 10px;
            display: none;
        }
        
        .success-message.show {
            display: flex;
        }
        
        /* 底部文字 */
        .footer-text {
            text-align: center;
            color: #95a5a6;
            font-size: 13px;
            margin-top: 25px;
            line-height: 1.5;
        }
        
        /* 響應式設計 */
        @media (max-width: 480px) {
            .header {
                padding: 40px 30px 30px;
            }
            
            .form-area {
                padding: 30px;
            }
            
            .main-title {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <!-- 登出成功提示 -->
    <div class="logout-toast" id="logoutToast">
        <i class="fas fa-check-circle"></i>
        <span>登出成功</span>
    </div>
    
    <div class="login-container">
        <!-- 右上角登出按鈕 -->
        <div class="top-controls">
            <button class="logout-btn" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i>
                登出
            </button>
        </div>
        
        <!-- 頂部區域 -->
        <div class="header">
            <div class="logo">TestPaper System</div>
            <h1 class="main-title">迅速登入或註冊</h1>
            <p class="subtitle">使用你的電子郵件或其他服務，以繼續使用試卷題庫系統！</p>
        </div>
        
        <!-- 表單區域 -->
        <div class="form-area">
            <!-- 表單切換 -->
            <div class="form-tabs">
                <button class="tab-btn active" id="loginTab">登入</button>
                <button class="tab-btn" id="registerTab">註冊</button>
            </div>
            
            <!-- 錯誤訊息 -->
            <div class="error-message" id="errorMessage">
                <i class="fas fa-exclamation-circle"></i>
                <span id="errorText">請檢查您的輸入</span>
            </div>
            
            <!-- 成功訊息 -->
            <div class="success-message" id="successMessage">
                <i class="fas fa-check-circle"></i>
                <span id="successText">操作成功</span>
            </div>
            
            <!-- 登入表單 -->
            <div class="form-content active" id="loginForm">
                <form id="loginFormElement">
                    <div class="input-group">
                        <label for="loginEmail">電子郵件</label>
                        <input type="email" id="loginEmail" placeholder="example@email.com" required>
                    </div>
                    <div class="input-group">
                        <label for="loginPassword">密碼</label>
                        <input type="password" id="loginPassword" placeholder="請輸入密碼" required>
                    </div>
                    <button type="submit" class="submit-btn">登入</button>
                </form>
            </div>
            
            <!-- 註冊表單 -->
            <div class="form-content" id="registerForm">
                <form id="registerFormElement">
                    <div class="input-group">
                        <label for="registerEmail">電子郵件</label>
                        <input type="email" id="registerEmail" placeholder="example@email.com" required>
                    </div>
                    <div class="input-group">
                        <label for="registerPassword">密碼</label>
                        <input type="password" id="registerPassword" placeholder="至少8個字元" required>
                    </div>
                    <div class="input-group">
                        <label for="confirmPassword">確認密碼</label>
                        <input type="password" id="confirmPassword" placeholder="再次輸入密碼" required>
                    </div>
                    
                    <!-- 驗證碼區域 -->
                    <div class="input-group" id="verificationGroup">
                        <label for="verificationCode">驗證碼</label>
                        <div class="verification-code">
                            <input type="text" id="verificationCode" placeholder="輸入6位驗證碼" maxlength="6" required>
                        </div>
                        <div class="resend-code">
                            <button type="button" class="send-code-btn" id="sendCodeBtn">發送驗證碼</button>
                            <div class="countdown" id="countdown"></div>
                        </div>
                    </div>
                    
                    <button type="submit" class="submit-btn" id="registerSubmitBtn">註冊並驗證</button>
                </form>
            </div>
            
            <!-- 分隔線 -->
            <div class="divider">
                <span>或使用第三方服務</span>
            </div>
            
            <!-- Google登入按鈕 -->
            <button class="google-btn" id="googleLogin">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google">
                <span>使用 Google 帳號繼續</span>
            </button>
            
            <!-- 底部文字 -->
            <p class="footer-text">
                點擊「註冊」即表示您同意我們的服務條款和隱私政策
            </p>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    
    <script>
        // Firebase 設定 - 使用您的設定
        const firebaseConfig = {
            apiKey: "AIzaSyDHaIeMD8WnFKtDuF08_5GseMC6S-OCCi0",
            authDomain: "project-7983367571690113440.firebaseapp.com",
            projectId: "project-7983367571690113440",
            storageBucket: "project-7983367571690113440.firebasestorage.app",
            messagingSenderId: "17335949650",
            appId: "1:17335949650:web:ef1f03971b2d0ee74f028b"
        };
        
        // 初始化 Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        
        // DOM元素
        const loginTab = document.getElementById('loginTab');
        const registerTab = document.getElementById('registerTab');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const loginFormElement = document.getElementById('loginFormElement');
        const registerFormElement = document.getElementById('registerFormElement');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const errorText = document.getElementById('errorText');
        const successText = document.getElementById('successText');
        const logoutBtn = document.getElementById('logoutBtn');
        const logoutToast = document.getElementById('logoutToast');
        const googleLoginBtn = document.getElementById('googleLogin');
        const sendCodeBtn = document.getElementById('sendCodeBtn');
        const countdownEl = document.getElementById('countdown');
        const verificationCodeInput = document.getElementById('verificationCode');
        const registerEmailInput = document.getElementById('registerEmail');
        const registerSubmitBtn = document.getElementById('registerSubmitBtn');
        
        // 驗證碼相關變數
        let currentVerificationCode = '';
        let countdownTimer = null;
        let countdownSeconds = 60;
        
        // 表單切換
        loginTab.addEventListener('click', () => {
            switchToForm('login');
        });
        
        registerTab.addEventListener('click', () => {
            switchToForm('register');
        });
        
        function switchToForm(formType) {
            // 更新選項卡
            loginTab.classList.remove('active');
            registerTab.classList.remove('active');
            
            // 隱藏所有表單
            loginForm.classList.remove('active');
            registerForm.classList.remove('active');
            
            // 清除訊息
            hideMessages();
            
            // 顯示選擇的表單
            if (formType === 'login') {
                loginTab.classList.add('active');
                loginForm.classList.add('active');
            } else {
                registerTab.classList.add('active');
                registerForm.classList.add('active');
            }
        }
        
        // 發送驗證碼函數
        async function sendVerificationCode() {
            const email = registerEmailInput.value;
            
            if (!email) {
                showError('請先輸入電子郵件');
                return false;
            }
            
            if (!isValidEmail(email)) {
                showError('請輸入有效的電子郵件地址');
                return false;
            }
            
            // 檢查是否已註冊
            try {
                const methods = await auth.fetchSignInMethodsForEmail(email);
                if (methods.length > 0) {
                    showError('此電子郵件已註冊，請直接登入');
                    switchToForm('login');
                    document.getElementById('loginEmail').value = email;
                    return false;
                }
            } catch (error) {
                console.log('檢查用戶是否存在時發生錯誤:', error);
                // 繼續發送驗證碼
            }
            
            // 禁用發送按鈕
            sendCodeBtn.disabled = true;
            sendCodeBtn.textContent = '發送中...';
            
            try {
                // 生成6位數字驗證碼
                currentVerificationCode = Math.floor(100000 + Math.random() * 900000).toString();
                
                console.log('生成的驗證碼:', currentVerificationCode, 'for email:', email);
                
                // 儲存到 Firestore
                await db.collection('verificationCodes').doc(email).set({
                    code: currentVerificationCode,
                    email: email,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    expiresAt: new Date(Date.now() + 10 * 60 * 1000), // 10分鐘後過期
                    verified: false,
                    attempts: 0
                });
                
                console.log('驗證碼已儲存到 Firestore');
                
                // 顯示成功訊息（實際應用中這裡會發送郵件）
                showSuccess(`驗證碼已發送到 ${email}`);
                
                // 在控制台顯示驗證碼（方便測試）
                console.log(`測試用驗證碼: ${currentVerificationCode}`);
                
                // 開始倒數計時
                countdownSeconds = 60;
                updateCountdown();
                
                countdownTimer = setInterval(() => {
                    countdownSeconds--;
                    updateCountdown();
                    if (countdownSeconds <= 0) {
                        clearInterval(countdownTimer);
                        sendCodeBtn.disabled = false;
                        sendCodeBtn.textContent = '重新發送驗證碼';
                        countdownEl.textContent = '';
                    }
                }, 1000);
                
                return true;
                
            } catch (error) {
                console.error('發送驗證碼失敗:', error);
                
                // 顯示詳細錯誤訊息
                let errorMsg = '無法發送驗證碼';
                
                if (error.code === 'permission-denied') {
                    errorMsg += ' (權限被拒絕)。請檢查 Firestore 規則設定。';
                    console.error('Firestore 權限錯誤，請檢查規則設定');
                } else {
                    errorMsg += `: ${error.message}`;
                }
                
                showError(errorMsg);
                
                // 重新啟用按鈕
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '發送驗證碼';
                
                return false;
            }
        }
        
        // 更新倒數計時顯示
        function updateCountdown() {
            countdownEl.textContent = `${countdownSeconds}秒後可重新發送`;
            sendCodeBtn.textContent = `發送中 (${countdownSeconds}s)`;
        }
        
        // 發送驗證碼按鈕點擊
        sendCodeBtn.addEventListener('click', sendVerificationCode);
        
        // 登出功能
        logoutBtn.addEventListener('click', () => {
            auth.signOut().then(() => {
                logoutToast.classList.add('show');
                
                setTimeout(() => {
                    logoutToast.classList.remove('show');
                }, 3000);
                
                console.log('用戶已登出');
                showSuccess('已成功登出');
            }).catch(error => {
                showError('登出失敗: ' + error.message);
            });
        });
        
        // Google登入
        googleLoginBtn.addEventListener('click', () => {
            showError('Google登入功能需配置OAuth客户端ID');
        });
        
        // 註冊表單提交
        registerFormElement.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = registerEmailInput.value;
            const password = document.getElementById('registerPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const verificationCode = verificationCodeInput.value;
            
            // 清除之前的訊息
            hideMessages();
            
            // 基本驗證
            if (!isValidEmail(email)) {
                showError('請輸入有效的電子郵件地址');
                return;
            }
            
            if (password.length < 8) {
                showError('密碼長度至少需要8個字元');
                return;
            }
            
            if (password !== confirmPassword) {
                showError('兩次輸入的密碼不一致');
                return;
            }
            
            if (!verificationCode || verificationCode.length !== 6) {
                showError('請輸入6位驗證碼');
                return;
            }
            
            // 檢查是否已發送驗證碼
            if (!currentVerificationCode) {
                showError('請先發送驗證碼');
                return;
            }
            
            // 禁用提交按鈕
            registerSubmitBtn.disabled = true;
            registerSubmitBtn.textContent = '註冊中...';
            
            try {
                // 從 Firestore 取得驗證碼
                const verificationDoc = await db.collection('verificationCodes').doc(email).get();
                
                if (!verificationDoc.exists) {
                    showError('請先發送驗證碼');
                    registerSubmitBtn.disabled = false;
                    registerSubmitBtn.textContent = '註冊並驗證';
                    return;
                }
                
                const verificationData = verificationDoc.data();
                
                // 檢查是否過期
                const expiresAt = verificationData.expiresAt.toDate();
                if (expiresAt < new Date()) {
                    showError('驗證碼已過期，請重新發送');
                    registerSubmitBtn.disabled = false;
                    registerSubmitBtn.textContent = '註冊並驗證';
                    return;
                }
                
                // 檢查是否已驗證
                if (verificationData.verified) {
                    showError('此驗證碼已使用過');
                    registerSubmitBtn.disabled = false;
                    registerSubmitBtn.textContent = '註冊並驗證';
                    return;
                }
                
                // 檢查嘗試次數
                if (verificationData.attempts >= 5) {
                    showError('嘗試次數過多，請重新發送驗證碼');
                    registerSubmitBtn.disabled = false;
                    registerSubmitBtn.textContent = '註冊並驗證';
                    return;
                }
                
                // 檢查驗證碼是否正確
                if (verificationData.code !== verificationCode) {
                    // 增加嘗試次數
                    await verificationDoc.ref.update({
                        attempts: firebase.firestore.FieldValue.increment(1)
                    });
                    
                    showError('驗證碼錯誤，請重新輸入');
                    registerSubmitBtn.disabled = false;
                    registerSubmitBtn.textContent = '註冊並驗證';
                    return;
                }
                
                // 建立使用者帳號
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 更新驗證碼狀態為已驗證
                await verificationDoc.ref.update({
                    verified: true,
                    verifiedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // 建立使用者資料文件
                await db.collection('users').doc(user.uid).set({
                    email: email,
                    displayName: email.split('@')[0],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                    emailVerified: true,
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                // 更新用戶顯示名稱
                await user.updateProfile({
                    displayName: email.split('@')[0]
                });
                
                // 顯示成功訊息
                showSuccess('註冊成功！帳號已驗證，現在可以登入。');
                
                // 清除表單
                registerEmailInput.value = '';
                document.getElementById('registerPassword').value = '';
                document.getElementById('confirmPassword').value = '';
                verificationCodeInput.value = '';
                currentVerificationCode = '';
                
                // 停止計時器
                if (countdownTimer) {
                    clearInterval(countdownTimer);
                }
                sendCodeBtn.disabled = false;
                sendCodeBtn.textContent = '發送驗證碼';
                countdownEl.textContent = '';
                
                // 自動切換到登入表單
                setTimeout(() => {
                    switchToForm('login');
                    document.getElementById('loginEmail').value = email;
                }, 1500);
                
            } catch (error) {
                console.error('註冊錯誤:', error);
                
                let errorMessage = '註冊失敗: ';
                
                switch(error.code) {
                    case 'auth/email-already-in-use':
                        errorMessage = '此電子郵件已註冊，請直接登入';
                        switchToForm('login');
                        document.getElementById('loginEmail').value = email;
                        break;
                    case 'auth/invalid-email':
                        errorMessage = '電子郵件格式無效';
                        break;
                    case 'auth/weak-password':
                        errorMessage = '密碼強度不足，請使用更複雜的密碼';
                        break;
                    default:
                        errorMessage += error.message;
                }
                
                showError(errorMessage);
            } finally {
                // 重新啟用提交按鈕
                registerSubmitBtn.disabled = false;
                registerSubmitBtn.textContent = '註冊並驗證';
            }
        });
        
        // 登入表單提交
        loginFormElement.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            // 清除之前的訊息
            hideMessages();
            
            if (!isValidEmail(email)) {
                showError('請輸入有效的電子郵件地址');
                return;
            }
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                const user = userCredential.user;
                
                // 更新最後登入時間
                await db.collection('users').doc(user.uid).update({
                    lastLogin: firebase.firestore.FieldValue.serverTimestamp()
                });
                
                showSuccess(`登入成功！歡迎 ${user.email}`);
                
                setTimeout(() => {
                    alert(`歡迎回來 ${user.email}！`);
                    // window.location.href = '/dashboard.html';
                }, 1000);
                
            } catch (error) {
                let errorMessage = '登入失敗: ';
                
                switch(error.code) {
                    case 'auth/user-not-found':
                        errorMessage = '此電子郵件尚未註冊';
                        switchToForm('register');
                        registerEmailInput.value = email;
                        break;
                    case 'auth/wrong-password':
                        errorMessage = '密碼錯誤，請重新輸入';
                        break;
                    case 'auth/user-disabled':
                        errorMessage = '此帳號已被停用';
                        break;
                    default:
                        errorMessage += error.message;
                }
                
                showError(errorMessage);
            }
        });
        
        // 顯示錯誤訊息
        function showError(message) {
            errorText.textContent = message;
            errorMessage.classList.add('show');
            successMessage.classList.remove('show');
        }
        
        // 顯示成功訊息
        function showSuccess(message) {
            successText.textContent = message;
            successMessage.classList.add('show');
            errorMessage.classList.remove('show');
        }
        
        // 隱藏所有訊息
        function hideMessages() {
            errorMessage.classList.remove('show');
            successMessage.classList.remove('show');
        }
        
        // 驗證電子郵件格式
        function isValidEmail(email) {
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            return emailRegex.test(email);
        }
        
        // 初始化：檢查用戶登入狀態
        auth.onAuthStateChanged(user => {
            if (user) {
                console.log('用戶已登入:', user.email);
                logoutBtn.style.display = 'flex';
            } else {
                console.log('用戶未登入');
                logoutBtn.style.display = 'flex';
            }
        });
        
        // 隱藏登出提示
        logoutToast.classList.remove('show');
    </script>
</body>
</html>
